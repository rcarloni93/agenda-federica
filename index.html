<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<title>Agenda &amp; Entrate — Federica</title>
<meta name="theme-color" content="#1E4A47" />
<link rel="manifest" href="./manifest.json" />
<link rel="apple-touch-icon" href="./icons/icon.svg" />
<link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="Agenda" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./style.css" />
</head>
<body>

<div id="app">

  <header class="topbar">
    <button id="toggleSidebar" class="icon-btn" aria-label="Apri categorie" title="Categorie">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M3 6h18M3 12h18M3 18h18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>

    <div class="week-nav">
      <button id="prevWeek" class="icon-btn" aria-label="Settimana precedente">‹</button>
      <div class="week-label-wrap">
        <h1 id="weekLabel">—</h1>
        <button id="todayBtn" class="link-btn">oggi</button>
      </div>
      <button id="nextWeek" class="icon-btn" aria-label="Settimana successiva">›</button>
    </div>

    <div class="topbar-actions">
      <button id="summaryToggle" class="icon-btn money-btn" aria-label="Entrate" title="Entrate">
        <svg viewBox="0 0 24 24" width="19" height="19"><path d="M12 2v20M17 6.5c0-1.8-2-3-5-3s-5 1.4-5 3 2 2.6 5 3 5 1.2 5 3-2 3-5 3-5-1.2-5-3" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></svg>
      </button>
      <button id="settingsBtn" class="icon-btn" aria-label="Impostazioni" title="Impostazioni">
        <svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.8" fill="none"/><path d="M19.4 13.5a1.7 1.7 0 000-3l1-1.7-1.7-1.7-1.7 1a1.7 1.7 0 00-3-1.2L13.5 4.6h-3L9.5 6.9a1.7 1.7 0 00-3 1.2l-1.7-1L3 8.8l1 1.7a1.7 1.7 0 000 3L3 15.2l1.7 1.7 1.7-1a1.7 1.7 0 003 1.2l.5 2.3h3l.5-2.3a1.7 1.7 0 003-1.2l1.7 1 1.7-1.7-1-1.7z" stroke="currentColor" stroke-width="1.3" fill="none" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </header>

  <div class="layout">

    <aside id="sidebar" class="sidebar">
      <div class="sidebar-head">
        <h2>Categorie</h2>
        <p class="hint">Trascina una categoria in agenda per creare un impegno</p>
      </div>
      <div id="categoryList" class="category-list"></div>
      <button id="addCategoryBtn" class="btn-outline btn-block">+ Nuova categoria</button>

      <div id="conflictBanner" class="conflict-banner hidden"></div>

      <div class="sidebar-foot">
        <button id="manageLocationsBtn" class="link-btn-block">Gestisci indirizzi &amp; sedi</button>
        <button id="exportBtn" class="link-btn-block">Esporta dati (JSON)</button>
      </div>
    </aside>

    <main class="calendar-wrap">
      <div class="days-header" id="daysHeader"></div>
      <div class="calendar-scroll" id="calendarScroll">
        <div class="calendar-inner" id="calendarInner">
          <div class="time-col" id="timeCol"></div>
          <div class="days-grid" id="daysGrid"></div>
        </div>
      </div>
    </main>

    <aside id="summaryPanel" class="summary-panel">
      <div class="summary-head">
        <h2>Entrate</h2>
        <div class="period-toggle" id="periodToggle">
          <button class="period-btn active" data-period="week">Settimana</button>
          <button class="period-btn" data-period="month">Mese</button>
        </div>
      </div>
      <div id="summaryBody" class="summary-body"></div>
    </aside>

  </div>
</div>

<!-- overlay used by every modal -->
<div id="overlay" class="overlay hidden"></div>

<div id="eventModal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="categoryModal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="locationModal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="locationsManagerModal" class="modal hidden" role="dialog" aria-modal="true"></div>
<div id="settingsModal" class="modal hidden" role="dialog" aria-modal="true"></div>

<div id="toast" class="toast hidden"></div>
<div id="dragGhost" class="drag-ghost hidden"></div>

<script src="./db.js"></script>
<script src="./geo.js"></script>
<script src="./finance.js"></script>
<script src="./app.js"></script>
</body>
</html>
